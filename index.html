<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 캘린더</title>
<link rel="stylesheet" href="_ds/ios-26-design-system-75cbb073-9cda-487c-ac9b-579bedbd0f5a/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<!-- 테마·언어 설정 + 문자열 테이블. legal.js 와 같은 계층이고 그중 맨 앞이다 —
     로드 즉시 applyTheme() 이 돌아야 첫 페인트에 흰 화면이 번쩍이지 않는다. -->
<script src="js/i18n.js"></script>
<!-- 약관 본문 상수. terms.html / privacy.html 도 이 파일 하나를 읽는다. -->
<script src="js/legal.js"></script>
<!-- 로드 순서 고정: auth → calendar(state 생성) → export → todo(부트스트랩) -->
<script src="js/auth.js"></script>
<script src="js/calendar.js"></script>
<!-- calendar.js 뒤(state·fmt·itemsOn 을 쓴다) · todo.js 앞(todo.js 끝의
     render() 보다 renderExportSheet 가 먼저 있어야 한다). -->
<script src="js/export.js"></script>
<script src="js/todo.js"></script>
<!-- 모듈이라 위 3개보다 나중에 실행된다. 그 사이 화면은 로딩 상태. -->
<script type="module" src="js/firebase.js"></script>
</body>
</html>
