<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 캘린더</title>

<!-- 링크를 공유했을 때 뜨는 카드(카톡·트위터 등). 그림은 tools/og.html 로 만든다.
     ★ og:image 는 **절대 URL 이어야 한다** — 카톡을 비롯한 크롤러가 상대 경로를
       못 읽는다. 도메인은 CNAME 과 같은 값이다.
     ★ 여기 글은 i18n 을 안 탄다. 크롤러는 앱이 뜨기 전의 HTML 만 읽으므로
       언어 설정으로 못 바꾼다 — 주 언어인 한국어로 고정한다. -->
<meta name="description" content="달력과 할 일을 한 화면에서. 월·주·일 세 가지 보기, 카테고리마다 다른 색, 로그인하면 기기끼리 동기화되는 개인 할 일 캘린더.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="할 일 캘린더">
<meta property="og:url" content="https://todo-calendar.kro.kr/">
<meta property="og:title" content="할 일 캘린더">
<meta property="og:description" content="달력과 할 일을 한 화면에서. 월·주·일 세 가지 보기, 카테고리마다 다른 색, 로그인하면 기기끼리 동기화됩니다.">
<meta property="og:image" content="https://todo-calendar.kro.kr/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="할 일 캘린더 — 월간 달력과 그날의 할 일 목록">
<meta property="og:locale" content="ko_KR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">

<!-- 파비콘. 원본은 icon-512.png 이고 나머지 셋은 그걸 줄인 것이다. -->
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="stylesheet" href="_ds/ios-26-design-system-75cbb073-9cda-487c-ac9b-579bedbd0f5a/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<!-- 테마·언어 설정 + 문자열 테이블. legal.js 와 같은 계층이고 그중 맨 앞이다 —
     로드 즉시 applyTheme() 이 돌아야 첫 페인트에 흰 화면이 번쩍이지 않는다. -->
<script src="js/i18n.js"></script>
<!-- 약관 본문 상수. terms.html / privacy.html 도 이 파일 하나를 읽는다. -->
<script src="js/legal.js"></script>
<!-- 로드 순서 고정: auth → calendar(state 생성) → export → todo(부트스트랩) -->
<script src="js/auth.js"></script>
<script src="js/calendar.js"></script>
<!-- calendar.js 뒤(state·fmt·itemsOn 을 쓴다) · todo.js 앞(todo.js 끝의
     render() 보다 renderExportSheet 가 먼저 있어야 한다). -->
<script src="js/export.js"></script>
<script src="js/todo.js"></script>
<!-- 모듈이라 위 3개보다 나중에 실행된다. 그 사이 화면은 로딩 상태. -->
<script type="module" src="js/firebase.js"></script>
</body>
</html>
