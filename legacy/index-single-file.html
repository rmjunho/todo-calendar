<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 캘린더</title>
<link rel="stylesheet" href="_ds/ios-26-design-system-75cbb073-9cda-487c-ac9b-579bedbd0f5a/styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --font-text:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI',sans-serif;
  /* Raised look — the default treatment for every button and card. */
  --tc-sheen:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 48%,rgba(0,0,0,.06));
  --tc-raise:inset 0 1px 0 rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.10),0 3px 8px rgba(0,0,0,.10),0 8px 18px rgba(0,0,0,.07);
  --tc-raise-sm:inset 0 1px 0 rgba(255,255,255,.45),0 1px 2px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.08);
  --tc-card-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.07),0 16px 36px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.65);
}
:root[data-theme="dark"]{
  --tc-sheen:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.03) 48%,rgba(0,0,0,.18));
  --tc-raise:inset 0 1px 0 rgba(255,255,255,.10),0 1px 2px rgba(0,0,0,.5),0 4px 10px rgba(0,0,0,.45),0 10px 22px rgba(0,0,0,.4);
  --tc-raise-sm:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.4);
  --tc-card-shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);
}
/* Default card. Anything that groups content (calendar, sheets, login box)
   uses this so depth stays consistent with the buttons. */
.card{background:var(--bg);background-image:var(--tc-sheen);background-repeat:no-repeat;
  background-size:100% 96px;border-radius:20px;box-shadow:var(--tc-card-shadow)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-secondary);color:var(--label);font-family:var(--font-text);min-height:100vh}
a{color:var(--tint);text-decoration:none}
a:hover{text-decoration:underline}
input:focus,textarea:focus{outline:2px solid var(--tint);outline-offset:-1px}
@keyframes tcFade{from{opacity:0}to{opacity:1}}
@keyframes tcSheet{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes iosMenuIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}

/* --- iOS 26 Button (port of DS Button.jsx) --- */
.btn{display:inline-flex;align-items:center;justify-content:center;border:none;outline:none;
  font-family:var(--font-text);font-weight:var(--weight-semibold);letter-spacing:var(--text-body-tracking);
  line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:var(--radius-capsule);
  background-image:var(--tc-sheen);box-shadow:var(--tc-raise);
  transition:transform var(--duration-fast) var(--ease-standard),background var(--duration-fast) var(--ease-standard),filter var(--duration-fast) var(--ease-standard)}
.btn:active:not(:disabled){transform:scale(var(--press-scale))}
.btn:disabled{opacity:.4;cursor:default}
.btn-sm{height:34px;min-width:34px;padding:0 14px;gap:5px;font-size:var(--text-subheadline-size)}
.btn-md{height:44px;min-width:44px;padding:0 18px;gap:6px;font-size:var(--text-body-size)}
.btn-lg{height:50px;min-width:50px;padding:0 22px;gap:8px;font-size:var(--text-headline-size)}
.btn-icon.btn-sm{width:34px;padding:0}
.btn-icon.btn-md{width:44px;padding:0}
.btn-icon.btn-lg{width:50px;padding:0}
/* Variants set background-COLOR only — the shorthand would wipe the .btn sheen. */
.btn-prominent{background-color:var(--tint);color:var(--on-tint)}
.btn-prominent:hover:not(:disabled){filter:brightness(1.08)}
.btn-gray{background-color:var(--fill-tertiary);color:var(--label)}
.btn-plain{background:transparent;background-image:none;box-shadow:none;color:var(--tint)}
.btn-plain:hover:not(:disabled){opacity:.7}
.btn-glass{background-color:var(--glass-fill);color:var(--label);
  -webkit-backdrop-filter:blur(var(--blur-glass)) saturate(var(--backdrop-saturate));
  backdrop-filter:blur(var(--blur-glass)) saturate(var(--backdrop-saturate));
  box-shadow:inset 0 1px 0 var(--glass-highlight),inset 0 0 0 .5px var(--glass-border),var(--shadow-glass)}
.btn-glass:hover:not(:disabled){background-color:var(--glass-fill-hover)}
.btn-glass:active:not(:disabled){background-color:var(--glass-fill-pressed)}

/* --- Colour-matched shadows for the two accented button groups --- */
[data-raise="glass"] .btn{box-shadow:inset 0 1px 0 var(--glass-highlight),inset 0 0 0 .5px var(--glass-border),0 1px 2px rgba(0,0,0,.08),0 4px 10px rgba(0,0,0,.10),0 12px 26px rgba(0,0,0,.12)}
[data-raise="tint"] .btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 4px color-mix(in srgb,var(--tint) 35%,transparent),0 6px 14px color-mix(in srgb,var(--tint) 30%,transparent),0 14px 30px color-mix(in srgb,var(--tint) 25%,transparent)}

/* --- iOS 26 Switch (port of DS Switch.jsx) --- */
.sw{position:relative;width:51px;height:31px;flex-shrink:0;padding:0;border:none;
  border-radius:var(--radius-capsule);background:var(--fill);cursor:pointer;vertical-align:middle;
  transition:background var(--duration-base) var(--ease-standard);-webkit-tap-highlight-color:transparent}
.sw[aria-checked="true"]{background:var(--system-green)}
.sw span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);
  transition:transform var(--duration-base) var(--ease-spring)}
.sw[aria-checked="true"] span{transform:translateX(20px)}

/* --- iOS 26 PickerButton (port of DS PickerButton.jsx) --- */
.picker{position:relative;display:inline-block}
.picker-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 14px;
  border-radius:var(--radius-capsule);border:none;cursor:pointer;background:var(--fill-tertiary);color:var(--label);
  background-image:var(--tc-sheen);box-shadow:var(--tc-raise-sm);
  font-family:var(--font-text);font-size:var(--text-body-size);font-weight:var(--weight-semibold);
  letter-spacing:var(--text-body-tracking);transition:background var(--duration-fast) var(--ease-standard)}
.picker-menu{position:absolute;top:40px;left:0;min-width:220px;padding:6px;border-radius:var(--radius-lg);
  background:var(--material-thick);
  -webkit-backdrop-filter:blur(var(--blur-thick)) saturate(var(--backdrop-saturate));
  backdrop-filter:blur(var(--blur-thick)) saturate(var(--backdrop-saturate));
  box-shadow:inset 0 0 0 .5px var(--separator),var(--shadow-3);z-index:50;
  animation:iosMenuIn var(--duration-fast) var(--ease-decelerate)}
.picker-menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;
  padding:0 10px;border-radius:var(--radius-sm);border:none;background:transparent;color:var(--label);
  font-family:var(--font-text);font-size:var(--text-body-size);cursor:pointer;text-align:left}
.picker-menu button:hover{background:var(--fill-quaternary)}

.field{width:100%;border:none;background:var(--fill-tertiary);border-radius:12px;
  font-family:inherit;color:var(--label)}
/* Segmented control — the wrapper is a recessed card, each segment a raised
   chip, so all three read as buttons like the rest of the UI. */
.seg-wrap{display:flex;gap:3px;padding:3px;border-radius:999px;background:var(--fill-tertiary);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.10),inset 0 0 0 .5px var(--separator)}
.seg{border:none;cursor:pointer;padding:0 18px;height:32px;border-radius:999px;font-family:inherit;
  font-size:13px;font-weight:600;transition:all .18s ease;color:var(--label-secondary);
  background-color:var(--bg-secondary);background-image:var(--tc-sheen);box-shadow:var(--tc-raise-sm)}
.seg:active{transform:scale(var(--press-scale))}
.seg-on{color:var(--label);background-color:var(--bg);box-shadow:var(--tc-raise)}
.pri{display:flex;align-items:center;gap:6px;border:none;cursor:pointer;padding:0 14px;height:36px;
  border-radius:999px;font-family:inherit;font-size:13px;font-weight:600;transition:all .15s ease;
  background-image:var(--tc-sheen);box-shadow:var(--tc-raise-sm)}
.cell{min-height:96px;padding:5px 4px;border-top:.5px solid var(--separator);cursor:pointer;overflow:hidden}
.pill{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row-title{font-size:16px;font-weight:600}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const PRI = {
  high: { c: '#FF3B30', label: '높음' },
  med:  { c: '#FF9500', label: '보통' },
  low:  { c: '#34C759', label: '낮음' },
  none: { c: '#8E8E93', label: '없음' }
};
const PRI_ORDER = { high: 0, med: 1, low: 2, none: 3 };
const REP = { none: '반복 안 함', daily: '매일', weekly: '매주', monthly: '매월' };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const HOUR_START = 6, HOUR_H = 52;
const STORE_KEY = 'todo-cal-v1';       // legacy single-user store, migrated to the admin on first run
const USERS_KEY = 'todo-cal-users-v1';
// v2: sessions written before auto-login became opt-in must not sign anyone in.
const SESSION_KEY = 'todo-cal-session-v2';
const SHOW_COMPLETED = true;
const ADMIN = { name: '이준호', pin: '4943' };

// SF-Symbols-style glyphs, lifted verbatim from the design system's Icon.jsx
const GLYPHS = {
  'checkmark': '<path d="M5 12.5l4.2 4.3L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
  'xmark': '<path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  'plus': '<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
  'chevron.left': '<path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  'chevron.right': '<path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  'chevron.up.chevron.down': '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10l4-4 4 4"/><path d="M8 14l4 4 4-4"/></g>'
};
function icon(name, size, color) {
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" role="img" aria-label="' + name +
    '" style="display:inline-block;vertical-align:middle;flex-shrink:0' + (color ? ';color:' + color : '') + '">' +
    (GLYPHS[name] || '') + '</svg>';
}

// ---------------------------------------------------------------- utilities
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = (s) => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const uid = () => Math.random().toString(36).slice(2);

function timeLabel(t) {
  if (!t) return '';
  const p = t.split(':').map(Number);
  const ap = p[0] < 12 ? '오전' : '오후';
  const hh = p[0] % 12 === 0 ? 12 : p[0] % 12;
  return ap + ' ' + hh + ':' + pad(p[1]);
}

// ------------------------------------------------------------- recurrence
// ponytail: monthly recurrence matches on day-of-month, so a task on the 31st
// simply skips shorter months. Switch to a clamped "last day of month" rule if
// users report missed occurrences.
function occursOn(it, ds) {
  if (ds < it.date) return false;
  const rep = it.repeat || 'none';
  if (rep === 'none') return it.date === ds;
  if (rep === 'daily') return true;
  const a = parse(it.date), b = parse(ds);
  if (rep === 'weekly') return a.getDay() === b.getDay();
  if (rep === 'monthly') return a.getDate() === b.getDate();
  return false;
}
// Repeating tasks track completion per-date; one-off tasks use a single flag.
function isDone(it, ds) {
  return (it.repeat && it.repeat !== 'none') ? (it.doneDates || []).includes(ds) : !!it.done;
}
function sortItems(list) {
  return list.slice().sort((x, y) => {
    const tx = x.time || '', ty = y.time || '';
    if (tx === ty) return (PRI_ORDER[x.pri] ?? 3) - (PRI_ORDER[y.pri] ?? 3);
    if (!tx) return -1;
    if (!ty) return 1;
    return tx < ty ? -1 : 1;
  });
}
function itemsOn(items, ds, showCompleted) {
  return sortItems(items.filter((it) => occursOn(it, ds) && (showCompleted || !isDone(it, ds))));
}

// ---------------------------------------------------------------- persistence
function seed(t) {
  const today = fmt(t);
  const first = fmt(new Date(t.getFullYear(), t.getMonth(), 1));
  return [
    { id: uid(), title: '팀 주간 회의', date: today, time: '10:00', pri: 'med', repeat: 'weekly', memo: '회의실 B · 안건 미리 준비', done: false, doneDates: [] },
    { id: uid(), title: '운동', date: today, time: '19:30', pri: 'low', repeat: 'daily', memo: '', done: false, doneDates: [] },
    { id: uid(), title: '약국 들르기', date: today, time: '', pri: 'low', repeat: 'none', memo: '', done: true, doneDates: [] },
    { id: uid(), title: '장보기', date: addDays(today, 1), time: '', pri: 'low', repeat: 'none', memo: '우유 · 달걀 · 시금치', done: false, doneDates: [] },
    { id: uid(), title: '프로젝트 제안서 마감', date: addDays(today, 3), time: '18:00', pri: 'high', repeat: 'none', memo: '최종 검토 후 제출', done: false, doneDates: [] },
    { id: uid(), title: '월세 이체', date: first, time: '', pri: 'high', repeat: 'monthly', memo: '', done: false, doneDates: [] }
  ];
}
// Each account gets its own task list — this is a personal calendar, not a shared one.
const itemsKey = (user) => STORE_KEY + ':' + user.id;

function load(user) {
  let items = null;
  try { items = JSON.parse(localStorage.getItem(itemsKey(user))); } catch (e) {}
  if (!Array.isArray(items)) {
    // First login: the admin inherits any tasks saved before accounts existed,
    // falling back to the sample set. New members start with an empty calendar.
    if (user.role === 'admin') {
      try { items = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
      if (!Array.isArray(items)) items = seed(new Date());
    } else {
      items = [];
    }
    save(user, items);
  }
  return items;
}
function save(user, items) {
  try { localStorage.setItem(itemsKey(user), JSON.stringify(items)); } catch (e) {}
}

// ---------------------------------------------------------------- accounts
// ponytail: PINs are stored in plain localStorage and verified in the browser,
// so this gates casual access between people sharing a device — it is NOT
// security. Anyone with devtools can read or bypass it. Move verification
// server-side (and hash the PIN there) the moment this leaves one machine.
const validPin = (p) => /^\d{4,8}$/.test(p || '');
const normName = (n) => (n || '').trim();
const findUser = (users, name) => users.find((u) => u.name === normName(name));

function loadUsers() {
  let users = null;
  try { users = JSON.parse(localStorage.getItem(USERS_KEY)); } catch (e) {}
  if (!Array.isArray(users) || !users.length) {
    users = [{ id: uid(), name: ADMIN.name, pin: ADMIN.pin, role: 'admin', status: 'approved', at: fmt(new Date()) }];
    saveUsers(users);
  }
  return users;
}
function saveUsers(users) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) {}
}

// ---------------------------------------------------------------- state
const now0 = new Date();
const state = {
  view: 'month',
  cy: now0.getFullYear(),
  cm: now0.getMonth(),
  selected: fmt(now0),
  items: [],
  showForm: false,
  editingId: null,
  form: null,
  repeatOpen: false,
  users: loadUsers(),
  user: null,
  auth: { mode: 'login', name: '', pin: '', pin2: '', remember: false, error: '', notice: '' },
  showAdmin: false
};
const blankForm = (date) => ({ title: '', date, hasTime: false, time: '09:00', pri: 'none', repeat: 'none', memo: '' });

function persist(items) { state.items = items; save(state.user, items); render(); }

// ---------------------------------------------------------------- auth
function startSession(user, remember) {
  state.user = user;
  state.items = load(user);
  state.auth = { mode: 'login', name: '', pin: '', pin2: '', remember: false, error: '', notice: '' };
  // Auto-login is opt-in: only a ticked switch lets the session survive a reload.
  try {
    if (remember) localStorage.setItem(SESSION_KEY, user.id);
    else localStorage.removeItem(SESSION_KEY);
  } catch (e) {}
  render();
}
function restoreSession() {
  let id = null;
  try { id = localStorage.getItem(SESSION_KEY); } catch (e) {}
  const u = id && state.users.find((x) => x.id === id && x.status === 'approved');
  if (u) { state.user = u; state.items = load(u); state.auth.remember = true; }
}
function logout() {
  state.user = null;
  state.items = [];
  state.showForm = false;
  state.showAdmin = false;
  // Logging out always clears the saved session, ticked or not, and unticks the
  // switch — whoever logs in next opts in for themselves.
  state.auth.remember = false;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  render();
}
function login() {
  const a = state.auth;
  const u = findUser(state.users, a.name);
  a.notice = '';
  if (!u || u.pin !== a.pin) { a.error = '이름 또는 PIN이 올바르지 않습니다.'; return render(); }
  if (u.status === 'pending') { a.error = '관리자 승인을 기다리는 중입니다.'; return render(); }
  if (u.status === 'rejected') { a.error = '가입 신청이 거절된 계정입니다.'; return render(); }
  startSession(u, a.remember);
}
function signup() {
  const a = state.auth;
  const name = normName(a.name);
  a.notice = '';
  if (!name) { a.error = '이름을 입력해 주세요.'; return render(); }
  if (findUser(state.users, name)) { a.error = '이미 사용 중인 이름입니다.'; return render(); }
  if (!validPin(a.pin)) { a.error = 'PIN은 숫자 4~8자리로 입력해 주세요.'; return render(); }
  if (a.pin !== a.pin2) { a.error = 'PIN이 서로 다릅니다.'; return render(); }
  state.users = state.users.concat({
    id: uid(), name, pin: a.pin, role: 'user', status: 'pending', at: fmt(new Date())
  });
  saveUsers(state.users);
  state.auth = { mode: 'login', name, pin: '', pin2: '', error: '',
    notice: '회원가입 신청이 접수되었습니다. 관리자 승인 후 로그인할 수 있습니다.' };
  render();
}
function decide(id, status) {
  state.users = state.users.map((u) => (u.id === id ? Object.assign({}, u, { status }) : u));
  saveUsers(state.users);
  render();
}
const pendingUsers = () => state.users.filter((u) => u.status === 'pending');

function toggleDone(id, ds) {
  persist(state.items.map((it) => {
    if (it.id !== id) return it;
    if (it.repeat && it.repeat !== 'none') {
      const dd = it.doneDates || [];
      return Object.assign({}, it, { doneDates: dd.includes(ds) ? dd.filter((x) => x !== ds) : dd.concat(ds) });
    }
    return Object.assign({}, it, { done: !it.done });
  }));
}

// ---------------------------------------------------------------- view model
function pill(it, ds) {
  const c = (PRI[it.pri] || PRI.none).c;
  const done = isDone(it, ds);
  return {
    id: it.id, title: it.title, color: c,
    bg: 'color-mix(in srgb, ' + c + ' 16%, transparent)',
    deco: done ? 'line-through' : 'none',
    op: done ? 0.5 : 1,
    timeLabel: it.time ? timeLabel(it.time) : '하루 종일'
  };
}
// data-open carries the id + the date the row was rendered for, so editing a
// repeating task opens it on the occurrence the user actually tapped.
const openAttr = (p, ds) => 'data-open="' + esc(p.id) + '" data-ds="' + ds + '"';

// ---------------------------------------------------------------- render
function render() {
  const today = fmt(new Date());
  const sel = state.selected;
  const selD = parse(sel);
  const todayD = new Date();
  const items = state.items;

  document.documentElement.setAttribute('data-theme',
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  if (!state.user) { document.getElementById('app').innerHTML = renderAuth(); return; }

  // -- header ---------------------------------------------------------------
  const monthLabel = state.view === 'month'
    ? state.cy + '년 ' + (state.cm + 1) + '월'
    : selD.getFullYear() + '년 ' + (selD.getMonth() + 1) + '월';
  const todayLabel = '오늘 · ' + (todayD.getMonth() + 1) + '월 ' + todayD.getDate() + '일 (' + DOW[todayD.getDay()] + ')';

  const segments = [['month', '월'], ['week', '주'], ['day', '일']].map(([k, label]) => {
    const on = state.view === k;
    return '<button class="seg' + (on ? ' seg-on' : '') + '" data-view="' + k + '">' + label + '</button>';
  }).join('');

  const isAdmin = state.user.role === 'admin';
  const pending = pendingUsers().length;
  const accountBar = '<div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:14px">' +
    '<span style="font-size:13px;font-weight:600;color:var(--label-secondary);background:var(--fill-quaternary);' +
      'padding:6px 12px;border-radius:999px">' + esc(state.user.name) +
      (isAdmin ? ' · 관리자' : '') + '</span>' +
    (isAdmin ? '<button class="btn btn-gray btn-sm" data-act="admin">회원가입 신청' +
      (pending ? '<span style="display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;' +
        'padding:0 5px;margin-left:2px;border-radius:999px;background:#FF3B30;color:#fff;font-size:11px;font-weight:700">' +
        pending + '</span>' : '') + '</button>' : '') +
    '<button class="btn btn-gray btn-sm" data-act="logout">로그아웃</button></div>';

  let html = '<div style="max-width:1024px;margin:0 auto;padding:28px 16px 130px">' + accountBar +
    '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px">' +
      '<div>' +
        '<div style="font-size:13px;font-weight:600;color:var(--tint)">' + esc(todayLabel) + '</div>' +
        '<h1 style="margin:2px 0 0;font-size:30px;font-weight:700;letter-spacing:.2px">' + esc(monthLabel) + '</h1>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
        '<div class="seg-wrap">' + segments + '</div>' +
        '<div data-raise="glass" style="display:flex;gap:8px;align-items:center">' +
          '<button class="btn btn-glass btn-sm btn-icon" data-nav="prev" aria-label="이전">' + icon('chevron.left', 15) + '</button>' +
          '<button class="btn btn-glass btn-sm" data-nav="today">오늘</button>' +
          '<button class="btn btn-glass btn-sm btn-icon" data-nav="next" aria-label="다음">' + icon('chevron.right', 15) + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  // -- month view -----------------------------------------------------------
  if (state.view === 'month') {
    const heads = DOW.map((l, i) =>
      '<div style="text-align:center;padding:11px 0 9px;font-size:12px;font-weight:600;color:' +
      (i === 0 ? '#FF3B30' : i === 6 ? 'var(--tint)' : 'var(--label-secondary)') + '">' + l + '</div>').join('');

    const startOffset = new Date(state.cy, state.cm, 1).getDay();
    const dim = new Date(state.cy, state.cm + 1, 0).getDate();
    const weeks = Math.ceil((startOffset + dim) / 7);
    let cells = '';
    for (let i = 0; i < weeks * 7; i++) {
      const d = new Date(state.cy, state.cm, 1 - startOffset + i);
      const ds = fmt(d);
      const inM = d.getMonth() === state.cm;
      const isToday = ds === today, isSel = ds === sel;
      const list = itemsOn(items, ds, SHOW_COMPLETED);
      const pills = list.slice(0, 3).map((it) => {
        const p = pill(it, ds);
        return '<div class="pill" ' + openAttr(p, ds) + ' style="cursor:pointer;background:' + p.bg + ';color:' + p.color +
          ';text-decoration:' + p.deco + ';opacity:' + p.op + '">' + esc(p.title) + '</div>';
      }).join('');
      const more = list.length > 3
        ? '<div style="font-size:10px;color:var(--label-tertiary);padding:0 6px">+' + (list.length - 3) + '개</div>' : '';
      cells += '<div class="cell" data-day="' + ds + '" style="background:' +
        (isSel ? 'color-mix(in srgb, var(--tint) 7%, transparent)' : 'transparent') + ';opacity:' + (inM ? 1 : 0.35) + '">' +
        '<div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;' +
          'font-size:13px;margin:0 auto 4px;font-weight:' + (isToday || isSel ? 700 : 500) +
          ';background:' + (isToday ? 'var(--tint)' : 'transparent') +
          ';color:' + (isToday ? '#fff' : d.getDay() === 0 ? '#FF3B30' : d.getDay() === 6 ? 'var(--tint)' : 'var(--label)') + '">' +
          d.getDate() + '</div>' +
        '<div style="display:flex;flex-direction:column;gap:2px">' + pills + more + '</div></div>';
    }
    html += '<div class="card" style="border:.5px solid var(--separator);overflow:hidden">' +
      '<div style="display:grid;grid-template-columns:repeat(7,1fr)">' + heads + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(7,1fr)">' + cells + '</div></div>';
  }

  // -- week view ------------------------------------------------------------
  if (state.view === 'week') {
    const ws = addDays(sel, -selD.getDay());
    let cols = '';
    for (let i = 0; i < 7; i++) {
      const ds = addDays(ws, i);
      const d = parse(ds);
      const isToday = ds === today, isSel = ds === sel;
      const list = itemsOn(items, ds, SHOW_COMPLETED).map((it) => {
        const p = pill(it, ds);
        return '<div ' + openAttr(p, ds) + ' style="cursor:pointer;padding:4px 7px;border-radius:6px;background:' +
          p.bg + ';opacity:' + p.op + '">' +
          '<div class="trunc" style="font-size:11px;font-weight:600;color:' + p.color + ';text-decoration:' + p.deco + '">' +
          esc(p.title) + '</div>' +
          '<div style="font-size:10px;font-weight:500;color:' + p.color + ';opacity:.75">' + esc(p.timeLabel) + '</div></div>';
      }).join('');
      cols += '<div style="min-height:320px;border-left:' + (i === 0 ? 'none' : '.5px solid var(--separator)') + '">' +
        '<div data-day="' + ds + '" style="cursor:pointer;text-align:center;padding:10px 4px 8px;border-bottom:.5px solid var(--separator)">' +
          '<div style="font-size:11px;font-weight:600;color:' +
            (i === 0 ? '#FF3B30' : i === 6 ? 'var(--tint)' : 'var(--label-secondary)') + '">' + DOW[i] + '</div>' +
          '<div style="width:28px;height:28px;margin:4px auto 0;border-radius:50%;display:flex;align-items:center;' +
            'justify-content:center;font-size:15px;font-weight:600;background:' +
            (isToday ? 'var(--tint)' : isSel ? 'var(--fill-tertiary)' : 'transparent') +
            ';color:' + (isToday ? '#fff' : 'var(--label)') + '">' + d.getDate() + '</div></div>' +
        '<div style="padding:6px 5px;display:flex;flex-direction:column;gap:4px">' + list + '</div></div>';
    }
    html += '<div class="card" style="border:.5px solid var(--separator);' +
      'overflow:hidden;display:grid;grid-template-columns:repeat(7,1fr)">' + cols + '</div>';
  }

  // -- day view -------------------------------------------------------------
  if (state.view === 'day') {
    const dayList = itemsOn(items, sel, SHOW_COMPLETED);
    const allDay = dayList.filter((it) => !it.time).map((it) => {
      const p = pill(it, sel);
      return '<div ' + openAttr(p, sel) + ' style="cursor:pointer;font-size:12px;font-weight:600;padding:5px 11px;' +
        'border-radius:999px;background:' + p.bg + ';color:' + p.color + ';text-decoration:' + p.deco +
        ';opacity:' + p.op + '">' + esc(p.title) + '</div>';
    }).join('');
    const allDayBlock = allDay
      ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' + allDay + '</div>' : '';

    let hours = '';
    for (let h = HOUR_START; h < 24; h++) {
      hours += '<div style="display:flex;height:' + HOUR_H + 'px;gap:8px;align-items:flex-start">' +
        '<div style="width:42px;text-align:right;font-size:11px;color:var(--label-tertiary);transform:translateY(-6px)">' +
        pad(h) + ':00</div><div style="flex:1;border-top:.5px solid var(--separator)"></div></div>';
    }

    const n = new Date();
    let nowLine = '';
    if (sel === today && n.getHours() >= HOUR_START) {
      const top = (n.getHours() * 60 + n.getMinutes() - HOUR_START * 60) / 60 * HOUR_H;
      nowLine = '<div style="position:absolute;left:52px;right:0;height:2px;border-radius:1px;background:#FF3B30;z-index:2;top:' +
        top + 'px"><div style="position:absolute;left:-5px;top:-3px;width:8px;height:8px;border-radius:50%;background:#FF3B30"></div></div>';
    }

    const timed = dayList.filter((it) => it.time).map((it) => {
      const p = pill(it, sel);
      const hm = it.time.split(':').map(Number);
      const top = Math.max(0, (hm[0] * 60 + hm[1] - HOUR_START * 60) / 60 * HOUR_H);
      return '<div ' + openAttr(p, sel) + ' style="position:absolute;left:58px;right:6px;height:46px;cursor:pointer;' +
        'border-radius:9px;padding:5px 10px;background:' + p.bg + ';border-left:3px solid ' + p.color +
        ';top:' + top + 'px;opacity:' + p.op + '">' +
        '<div class="trunc" style="font-size:13px;font-weight:600;color:' + p.color + ';text-decoration:' + p.deco + '">' +
        esc(p.title) + '</div>' +
        '<div style="font-size:11px;color:' + p.color + ';opacity:.75">' + esc(p.timeLabel) + '</div></div>';
    }).join('');

    html += '<div class="card" style="border:.5px solid var(--separator);padding:16px 16px 20px">' + allDayBlock +
      '<div style="position:relative">' + hours + nowLine + timed + '</div></div>';
  }

  // -- selected day list ----------------------------------------------------
  const selAll = itemsOn(items, sel, true);
  const selShown = SHOW_COMPLETED ? selAll : selAll.filter((it) => !isDone(it, sel));
  const remaining = selAll.filter((it) => !isDone(it, sel)).length;
  const selectedTitle = (sel === today ? '오늘 · ' : '') +
    (selD.getMonth() + 1) + '월 ' + selD.getDate() + '일 ' + DOW[selD.getDay()] + '요일';
  const remainLabel = selAll.length === 0 ? '' : remaining === 0 ? '모두 완료!' : remaining + '개 남음';

  let listHtml;
  if (selShown.length) {
    listHtml = selShown.map((it, idx) => {
      const c = (PRI[it.pri] || PRI.none).c;
      const done = isDone(it, sel);
      const open = 'data-open="' + esc(it.id) + '" data-ds="' + sel + '"';
      return '<div style="display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:' +
        (idx === 0 ? 'none' : '.5px solid var(--separator)') + '">' +
        '<button data-toggle="' + esc(it.id) + '" aria-label="완료 체크" aria-pressed="' + done + '" ' +
          'style="width:24px;height:24px;border-radius:50%;flex:none;cursor:pointer;padding:0;display:flex;' +
          'align-items:center;justify-content:center;border:2px solid ' + (done ? c : 'var(--label-quaternary)') +
          ';background:' + (done ? c : 'transparent') + ';transition:all .15s ease">' +
          (done ? icon('checkmark', 13, '#ffffff') : '') + '</button>' +
        '<div ' + open + ' style="flex:1;min-width:0;cursor:pointer">' +
          '<div class="row-title" style="text-decoration:' + (done ? 'line-through' : 'none') +
            ';opacity:' + (done ? 0.45 : 1) + '">' + esc(it.title) + '</div>' +
          (it.memo ? '<div class="trunc" style="font-size:13px;color:var(--label-secondary);margin-top:1px">' +
            esc(it.memo) + '</div>' : '') +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex:none">' +
          (it.repeat && it.repeat !== 'none'
            ? '<span style="font-size:11px;font-weight:600;color:var(--label-secondary);background:var(--fill-quaternary);' +
              'padding:3px 8px;border-radius:999px">' + esc(REP[it.repeat] || '') + '</span>' : '') +
          (it.time ? '<span style="font-size:13px;font-weight:500;color:var(--label-secondary);' +
            'font-variant-numeric:tabular-nums">' + esc(timeLabel(it.time)) + '</span>' : '') +
          '<span ' + open + ' style="cursor:pointer;color:var(--label-tertiary);display:flex">' +
            icon('chevron.right', 15) + '</span>' +
        '</div></div>';
    }).join('');
  } else {
    listHtml = '<div style="padding:34px 16px;text-align:center">' +
      '<div style="font-size:15px;font-weight:600;color:var(--label-secondary)">할 일이 없습니다</div>' +
      '<div style="font-size:13px;color:var(--label-tertiary);margin-top:3px">오른쪽 아래 + 버튼으로 추가해 보세요</div></div>';
  }

  html += '<div style="margin-top:22px">' +
    '<div style="display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px">' +
      '<h2 style="margin:0;font-size:20px;font-weight:700">' + esc(selectedTitle) + '</h2>' +
      '<span style="font-size:13px;font-weight:500;color:var(--label-secondary)">' + esc(remainLabel) + '</span></div>' +
    '<div class="card" style="border-radius:16px;border:.5px solid var(--separator);' +
      'overflow:hidden">' + listHtml + '</div></div>';

  html += '</div>'; // /page

  // -- floating add button --------------------------------------------------
  html += '<div data-raise="tint" style="position:fixed;right:24px;bottom:28px;z-index:60">' +
    '<button class="btn btn-prominent btn-lg btn-icon" data-act="open" aria-label="할 일 추가">' +
    icon('plus', 20) + '</button></div>';

  // -- form sheet -----------------------------------------------------------
  if (state.showForm) html += renderSheet();
  if (state.showAdmin && isAdmin) html += renderAdminSheet();

  document.getElementById('app').innerHTML = html;
}

// ---------------------------------------------------------------- login screen
function renderAuth() {
  const a = state.auth;
  const isLogin = a.mode === 'login';
  const tab = (mode, label) => {
    const on = a.mode === mode;
    return '<button class="seg' + (on ? ' seg-on' : '') + '" data-authmode="' + mode +
      '" style="flex:1;padding:0">' + label + '</button>';
  };
  const label = (t) => '<div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">' + t + '</div>';
  const pinField = (key, ph) => '<input class="field" type="password" data-a="' + key + '" inputmode="numeric" ' +
    'autocomplete="off" maxlength="8" placeholder="' + ph + '" value="' + esc(a[key]) + '" ' +
    'style="padding:12px 14px;font-size:16px;letter-spacing:.35em">';

  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px">' +
    '<div style="width:min(400px,100%)">' +
      '<div style="text-align:center;margin-bottom:22px">' +
        '<div style="font-size:13px;font-weight:600;color:var(--tint)">개인 할 일 캘린더</div>' +
        '<h1 style="margin:4px 0 0;font-size:28px;font-weight:700;letter-spacing:.2px">' +
          (isLogin ? '로그인' : '회원가입 신청') + '</h1></div>' +
      '<div class="card" style="border:.5px solid var(--separator);padding:18px 20px 24px">' +
        '<div class="seg-wrap">' +
          tab('login', '로그인') + tab('signup', '회원가입 신청') + '</div>' +

        label('이름') +
        '<input class="field" type="text" data-a="name" placeholder="이름을 입력하세요" autocomplete="off" ' +
          'value="' + esc(a.name) + '" style="padding:12px 14px;font-size:16px">' +

        label('PIN 번호' + (isLogin ? '' : ' (숫자 4~8자리)')) + pinField('pin', '••••') +
        (isLogin ? '' : label('PIN 번호 확인') + pinField('pin2', '••••')) +

        (isLogin ? '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px">' +
          '<div><div style="font-size:15px;font-weight:600">자동 로그인</div>' +
          '<div style="font-size:12px;color:var(--label-tertiary);margin-top:2px">다음에 열 때 로그인 화면을 건너뜁니다</div></div>' +
          '<button class="sw" role="switch" aria-checked="' + (a.remember ? 'true' : 'false') +
            '" data-act="toggleRemember" aria-label="자동 로그인"><span></span></button></div>' : '') +

        (a.error ? '<div role="alert" style="margin-top:14px;font-size:13px;font-weight:600;color:#FF3B30;' +
          'background:color-mix(in srgb, #FF3B30 12%, transparent);padding:10px 12px;border-radius:10px">' +
          esc(a.error) + '</div>' : '') +
        (a.notice ? '<div role="status" style="margin-top:14px;font-size:13px;font-weight:600;color:#34C759;' +
          'background:color-mix(in srgb, #34C759 14%, transparent);padding:10px 12px;border-radius:10px">' +
          esc(a.notice) + '</div>' : '') +

        '<div data-raise="tint" style="display:block;margin-top:20px">' +
          '<button class="btn btn-prominent btn-md" data-act="' + (isLogin ? 'login' : 'signup') + '" ' +
            'style="width:100%">' + (isLogin ? '로그인' : '가입 신청하기') + '</button></div>' +
        (isLogin ? '' : '<div style="margin-top:12px;font-size:12px;line-height:1.5;color:var(--label-tertiary);text-align:center">' +
          '관리자가 신청을 수락하면 로그인할 수 있습니다.</div>') +
      '</div></div></div>';
}

// ---------------------------------------------------------------- admin sheet
function renderAdminSheet() {
  const list = pendingUsers();
  const rows = list.length ? list.map((u, i) =>
    '<div style="display:flex;align-items:center;gap:12px;padding:14px 4px;border-top:' +
      (i === 0 ? 'none' : '.5px solid var(--separator)') + '">' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:16px;font-weight:600">' + esc(u.name) + '</div>' +
        '<div style="font-size:13px;color:var(--label-secondary);margin-top:1px">' + esc(u.at) + ' 신청</div></div>' +
      '<button class="btn btn-gray btn-sm" data-reject="' + esc(u.id) + '" style="color:#FF3B30">거절</button>' +
      '<span data-raise="tint" style="display:inline-flex">' +
        '<button class="btn btn-prominent btn-sm" data-approve="' + esc(u.id) + '">수락</button></span>' +
    '</div>').join('')
    : '<div style="padding:34px 4px;text-align:center">' +
      '<div style="font-size:15px;font-weight:600;color:var(--label-secondary)">대기 중인 신청이 없습니다</div></div>';

  return '<div data-act="closeAdmin" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);animation:tcFade .2s ease-out"></div>' +
    '<div style="position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;justify-content:center;pointer-events:none">' +
    '<div role="dialog" aria-modal="true" style="pointer-events:auto;width:min(560px,100vw);max-height:88vh;overflow:auto;' +
      'background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow-3);padding:12px 20px 30px;' +
      'animation:tcSheet .3s cubic-bezier(.34,1.3,.64,1)">' +
      '<div style="width:38px;height:5px;border-radius:3px;background:var(--fill-secondary);margin:0 auto 12px"></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<h3 style="margin:0;font-size:19px;font-weight:700">회원가입 신청</h3>' +
        '<button data-act="closeAdmin" aria-label="닫기" style="border:none;cursor:pointer;width:30px;height:30px;' +
          'border-radius:50%;background:var(--fill-tertiary);color:var(--label-secondary);display:flex;' +
          'align-items:center;justify-content:center;padding:0">' + icon('xmark', 14) + '</button></div>' +
      rows + '</div></div>';
}

function renderSheet() {
  const f = state.form;
  const priChoices = Object.keys(PRI).map((k) => {
    const on = f.pri === k, c = PRI[k].c;
    return '<button class="pri" data-pri="' + k + '" style="background-color:' +
      (on ? 'color-mix(in srgb, ' + c + ' 16%, transparent)' : 'var(--fill-tertiary)') +
      ';color:' + (on ? c : 'var(--label-secondary)') +
      (on ? ';box-shadow:inset 0 0 0 1.5px ' + c + ', var(--tc-raise-sm)' : '') + '">' +
      '<span style="width:9px;height:9px;border-radius:50%;background:' + c + '"></span>' + PRI[k].label + '</button>';
  }).join('');

  const repeatMenu = state.repeatOpen ? '<div class="picker-menu" role="menu">' +
    Object.keys(REP).map((k) =>
      '<button role="menuitemradio" aria-checked="' + (f.repeat === k) + '" data-repeat="' + k + '">' +
      '<span>' + REP[k] + '</span>' + (f.repeat === k ? icon('checkmark', 16, 'var(--tint)') : '') + '</button>'
    ).join('') + '</div>' : '';

  const timeBlock = f.hasTime
    ? '<input class="field" type="time" data-f="time" value="' + esc(f.time) + '" style="padding:11px 14px;font-size:15px">'
    : '<div style="padding:11px 14px;font-size:14px;color:var(--label-tertiary);background:var(--fill-quaternary);border-radius:12px">하루 종일</div>';

  return '<div data-act="close" style="position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.35);animation:tcFade .2s ease-out"></div>' +
    '<div style="position:fixed;left:0;right:0;bottom:0;z-index:101;display:flex;justify-content:center;pointer-events:none">' +
    '<div id="sheet" role="dialog" aria-modal="true" style="pointer-events:auto;width:min(560px,100vw);max-height:88vh;overflow:auto;' +
      'background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow-3);padding:12px 20px 30px;' +
      'animation:tcSheet .3s cubic-bezier(.34,1.3,.64,1)">' +
      '<div style="width:38px;height:5px;border-radius:3px;background:var(--fill-secondary);margin:0 auto 12px"></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
        '<h3 style="margin:0;font-size:19px;font-weight:700">' + (state.editingId ? '할 일 편집' : '새로운 할 일') + '</h3>' +
        '<button data-act="close" aria-label="닫기" style="border:none;cursor:pointer;width:30px;height:30px;border-radius:50%;' +
          'background:var(--fill-tertiary);color:var(--label-secondary);display:flex;align-items:center;justify-content:center;padding:0">' +
          icon('xmark', 14) + '</button></div>' +

      '<div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">제목</div>' +
      '<input class="field" type="text" data-f="title" placeholder="무엇을 해야 하나요?" value="' + esc(f.title) +
        '" style="padding:12px 14px;font-size:16px">' +

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        '<div><div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">날짜</div>' +
          '<input class="field" type="date" data-f="date" value="' + esc(f.date) + '" style="padding:11px 14px;font-size:15px"></div>' +
        '<div><div style="display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px">' +
            '<span style="font-size:13px;font-weight:600;color:var(--label-secondary)">시간</span>' +
            '<button class="sw" role="switch" data-act="toggleTime" aria-checked="' + f.hasTime + '" aria-label="시간 지정"><span></span></button>' +
          '</div>' + timeBlock + '</div></div>' +

      '<div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">우선순위</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + priChoices + '</div>' +

      '<div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">반복</div>' +
      '<div class="picker"><button class="picker-btn" data-act="repeatToggle" aria-haspopup="menu" aria-expanded="' + state.repeatOpen + '">' +
        '<span>' + REP[f.repeat] + '</span>' + icon('chevron.up.chevron.down', 15, 'var(--tint)') + '</button>' + repeatMenu + '</div>' +

      '<div style="font-size:13px;font-weight:600;color:var(--label-secondary);margin:14px 0 6px">메모</div>' +
      '<textarea class="field" rows="2" data-f="memo" placeholder="메모를 남겨 보세요 (선택)" ' +
        'style="padding:12px 14px;font-size:15px;resize:vertical">' + esc(f.memo) + '</textarea>' +

      '<div style="display:flex;gap:10px;margin-top:20px;align-items:center">' +
        (state.editingId ? '<button class="btn btn-plain btn-md" data-act="delete" style="color:#FF3B30">삭제</button>' : '') +
        '<div style="flex:1"></div>' +
        '<button class="btn btn-gray btn-md" data-act="close">취소</button>' +
        '<span data-raise="tint" style="display:inline-flex">' +
          '<button class="btn btn-prominent btn-md" id="saveBtn" data-act="save"' +
          (f.title.trim() ? '' : ' disabled') + '>저장</button></span>' +
      '</div></div></div>';
}

// ---------------------------------------------------------------- interaction
const app = document.getElementById('app');

function openForm(id, ds) {
  if (id) {
    const it = state.items.find((x) => x.id === id);
    if (!it) return;
    state.editingId = id;
    state.form = { title: it.title, date: ds || it.date, hasTime: !!it.time, time: it.time || '09:00',
      pri: it.pri || 'none', repeat: it.repeat || 'none', memo: it.memo || '' };
  } else {
    state.editingId = null;
    state.form = blankForm(state.selected);
  }
  state.showForm = true;
  state.repeatOpen = false;
  render();
}
function closeForm() {
  state.showForm = false;
  state.editingId = null;
  state.form = null;
  state.repeatOpen = false;
  render();
}
function saveForm() {
  const f = state.form;
  if (!f.title.trim()) return;
  const base = { title: f.title.trim(), date: f.date, time: f.hasTime ? f.time : '',
    pri: f.pri, repeat: f.repeat, memo: (f.memo || '').trim() };
  const items = state.editingId
    ? state.items.map((it) => (it.id === state.editingId ? Object.assign({}, it, base) : it))
    : state.items.concat(Object.assign({ id: uid() }, base, { done: false, doneDates: [] }));
  state.selected = f.date;
  state.showForm = false;
  state.editingId = null;
  state.form = null;
  persist(items);
}

app.addEventListener('click', (e) => {
  const t = e.target;
  const hit = (sel) => t.closest(sel);
  let el;

  if ((el = hit('[data-authmode]'))) {
    state.auth.mode = el.dataset.authmode;
    state.auth.pin = state.auth.pin2 = state.auth.error = state.auth.notice = '';
    return render();
  }
  if ((el = hit('[data-approve]'))) return decide(el.dataset.approve, 'approved');
  if ((el = hit('[data-reject]'))) return decide(el.dataset.reject, 'rejected');
  if ((el = hit('[data-view]'))) { state.view = el.dataset.view; return render(); }
  if ((el = hit('[data-nav]'))) {
    const dir = el.dataset.nav;
    if (dir === 'today') {
      const n = new Date();
      state.cy = n.getFullYear(); state.cm = n.getMonth(); state.selected = fmt(n);
    } else {
      const step = dir === 'prev' ? -1 : 1;
      if (state.view === 'month') {
        const m = new Date(state.cy, state.cm + step, 1);
        state.cy = m.getFullYear(); state.cm = m.getMonth();
      } else {
        state.selected = addDays(state.selected, step * (state.view === 'week' ? 7 : 1));
      }
    }
    return render();
  }
  if ((el = hit('[data-toggle]'))) { e.stopPropagation(); return toggleDone(el.dataset.toggle, state.selected); }
  if ((el = hit('[data-open]'))) { e.stopPropagation(); return openForm(el.dataset.open, el.dataset.ds); }
  if ((el = hit('[data-day]'))) {
    const ds = el.dataset.day, d = parse(ds);
    state.selected = ds; state.cy = d.getFullYear(); state.cm = d.getMonth();
    return render();
  }
  if ((el = hit('[data-pri]'))) { state.form.pri = el.dataset.pri; return render(); }
  if ((el = hit('[data-repeat]'))) { state.form.repeat = el.dataset.repeat; state.repeatOpen = false; return render(); }
  if ((el = hit('[data-act]'))) {
    switch (el.dataset.act) {
      case 'login': return login();
      case 'signup': return signup();
      case 'logout': return logout();
      case 'toggleRemember': state.auth.remember = !state.auth.remember; return render();
      case 'admin': state.showAdmin = true; return render();
      case 'closeAdmin': state.showAdmin = false; return render();
      case 'open': return openForm(null);
      case 'close': return closeForm();
      case 'save': return saveForm();
      case 'delete':
        state.showForm = false;
        return persist(state.items.filter((it) => it.id !== state.editingId));
      case 'toggleTime': state.form.hasTime = !state.form.hasTime; return render();
      case 'repeatToggle': state.repeatOpen = !state.repeatOpen; return render();
    }
  }
  // click outside an open repeat menu closes it
  if (state.repeatOpen && !hit('.picker')) { state.repeatOpen = false; render(); }
});

// Form fields stay uncontrolled so typing never re-renders (and never loses the
// caret); state is updated in place and read back on the next render.
app.addEventListener('input', (e) => {
  const auth = e.target.closest('[data-a]');
  if (auth) { state.auth[auth.dataset.a] = auth.value; return; }
  const el = e.target.closest('[data-f]');
  if (!el || !state.form) return;
  state.form[el.dataset.f] = el.value;
  if (el.dataset.f === 'title') {
    const btn = document.getElementById('saveBtn');
    if (btn) btn.disabled = !el.value.trim();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.showForm) return closeForm();
    if (state.showAdmin) { state.showAdmin = false; return render(); }
  }
  // Enter submits the login / signup form.
  if (e.key === 'Enter' && !state.user && e.target.closest('[data-a]')) {
    return state.auth.mode === 'login' ? login() : signup();
  }
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
// The "now" indicator tracks a real clock, so refresh the day view each minute.
setInterval(() => { if (state.view === 'day' && !state.showForm) render(); }, 60000);

restoreSession();
render();

// ---------------------------------------------------------------- self-check
// Run with ?selftest in the URL. Covers recurrence + per-date completion +
// ordering — the logic that silently corrupts the calendar if it breaks.
if (location.search.includes('selftest')) {
  const ok = (cond, msg) => { if (!cond) throw new Error('FAIL: ' + msg); };
  const w = { id: 'w', date: '2026-01-05', repeat: 'weekly', time: '', pri: 'none', doneDates: ['2026-01-12'] };
  const m = { id: 'm', date: '2026-01-31', repeat: 'monthly', time: '09:00', pri: 'none', doneDates: [] };
  const o = { id: 'o', date: '2026-01-05', repeat: 'none', time: '08:00', pri: 'high', done: true };

  ok(!occursOn(w, '2026-01-04'), 'no occurrence before start date');
  ok(occursOn(w, '2026-01-05') && occursOn(w, '2026-01-12'), 'weekly repeats on same weekday');
  ok(!occursOn(w, '2026-01-13'), 'weekly skips other weekdays');
  ok(occursOn(m, '2026-03-31'), 'monthly repeats on same day-of-month');
  ok(!occursOn(m, '2026-02-28'), 'monthly skips months without that day');
  ok(occursOn(o, '2026-01-05') && !occursOn(o, '2026-01-06'), 'one-off occurs only on its date');

  ok(isDone(w, '2026-01-12') && !isDone(w, '2026-01-05'), 'repeating completion is per-date');
  ok(isDone(o, '2026-01-05'), 'one-off completion uses the done flag');

  ok(itemsOn([w, m, o], '2026-01-05', true).map((x) => x.id).join() === 'w,o',
    'all-day sorts before timed items');
  ok(itemsOn([w, m, o], '2026-01-05', false).map((x) => x.id).join() === 'w',
    'completed items are filtered out when hidden');

  // --- accounts ---
  ok(validPin('4943') && validPin('12345678'), 'PINs of 4 to 8 digits are accepted');
  ok(!validPin('123') && !validPin('123456789'), 'PINs outside 4-8 digits are rejected');
  ok(!validPin('12a4') && !validPin('') && !validPin(null), 'non-numeric and empty PINs are rejected');

  const admin = state.users.find((u) => u.role === 'admin');
  ok(admin && admin.name === '이준호' && admin.pin === '4943' && admin.status === 'approved',
    'the admin account is seeded and pre-approved');
  ok(findUser(state.users, '  이준호  '), 'lookup trims surrounding whitespace in the name');
  ok(!findUser(state.users, '이준'), 'lookup does not match a partial name');
  ok(itemsKey({ id: 'a1' }) !== itemsKey({ id: 'a2' }), 'each account stores tasks under its own key');

  console.log('selftest: all checks passed');
}
})();
</script>
