<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>og.png 만들기</title>
<!-- 앱과 **같은 서체**를 쓴다. 다만 index.html 이 쓰는 dynamic-subset 판이 아니라
     통짜 파일이다 — 서브셋 판은 DOM 에 실제로 글자가 그려질 때 필요한 조각만
     받아오는데, 캔버스 글자는 DOM 이 아니라서 그 로딩을 깨우지 못한다.
     그래서 여기서만 통짜를 받는다(생성기라 용량은 상관없다). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  body{margin:0;padding:24px;background-color:#1c1c1e;color:#fff;
       font-family:"Pretendard Variable",-apple-system,"Malgun Gothic",sans-serif}
  canvas{width:100%;max-width:900px;height:auto;border-radius:12px;display:block}
  #log{margin-top:12px;font-size:14px;color:#98989d}
  a{color:#0a84ff}
</style>
</head>
<body>
<canvas id="cv" width="1200" height="630"></canvas>
<div id="log">그리는 중…</div>

<script>
// og.png(1200×630) 생성기. 앱 코드가 아니라 **한 번 쓰고 마는 도구**다.
// 쓰는 법: 저장소 루트에서 작은 정적 서버를 띄우고 이 파일을 연다.
// POST /save 를 받아 주는 서버면 자동으로 og.png 를 덮어쓰고, 아니면 아래
// 내려받기 링크가 뜬다.
// ★ 색은 지어내지 말 것. 전부 _ds/tokens/colors.css 와 calendar.js 의
//   CAT_COLORS 에서 그대로 가져온 값이다.
(function () {
  var W = 1200, H = 630;
  var FONT = '"Pretendard Variable", -apple-system, "Malgun Gothic", sans-serif';
  var FALLBACK = '"Malgun Gothic", sans-serif';

  var C = {
    bg:    '#F2F2F7',                 // --bg-secondary
    card:  '#FFFFFF',                 // --bg
    label: '#000000',                 // --label
    sec:   'rgba(60,60,67,0.6)',      // --label-secondary
    ter:   'rgba(60,60,67,0.32)',     // --label-tertiary 근처
    sep:   'rgba(60,60,67,0.12)',     // --separator 옅게
    tint:  '#007AFF',                 // --tint
    red:   '#FF3B30'
  };
  // calendar.js 의 CAT_COLORS 중 그림에 쓸 것들
  var CAT = ['#FF3B30', '#FF9500', '#34C759', '#00C7BE', '#5856D6', '#AF52DE'];

  var cv = document.getElementById('cv');
  var x = cv.getContext('2d');
  var f = function (w, s) { return w + ' ' + s + 'px ' + FONT; };
  var rr = function (a, b, w, h, r) { x.beginPath(); x.roundRect(a, b, w, h, r); };
  var dot = function (a, b, r, color) {
    x.beginPath(); x.arc(a, b, r, 0, 6.284); x.fillStyle = color; x.fill();
  };

  function draw() {
    x.textBaseline = 'alphabetic';
    x.fillStyle = C.bg; x.fillRect(0, 0, W, H);

    /* ── 왼쪽: 아이콘 · 제목 · 설명 · 도메인 ───────────────────── */
    var L = 88;

    // 앱 아이콘 자리 — 파란 라운드 사각형에 흰 달력 글리프
    x.save();
    x.shadowColor = 'rgba(0,122,255,0.30)'; x.shadowBlur = 26; x.shadowOffsetY = 10;
    x.fillStyle = C.tint; rr(L, 96, 84, 84, 23); x.fill();
    x.restore();
    x.strokeStyle = '#FFFFFF'; x.lineWidth = 4; x.lineJoin = 'round'; x.lineCap = 'round';
    rr(L + 22, 96 + 28, 40, 34, 8); x.stroke();
    x.beginPath();
    x.moveTo(L + 22, 96 + 40); x.lineTo(L + 62, 96 + 40);          // 머리 줄
    x.moveTo(L + 33, 96 + 21); x.lineTo(L + 33, 96 + 30);          // 걸이 둘
    x.moveTo(L + 51, 96 + 21); x.lineTo(L + 51, 96 + 30);
    x.stroke();
    dot(L + 34, 96 + 51, 3.5, '#FFFFFF');
    dot(L + 50, 96 + 51, 3.5, 'rgba(255,255,255,0.55)');

    // 제목
    x.fillStyle = C.label; x.font = f(800, 84); x.letterSpacing = '-3px';
    x.fillText('할 일 캘린더', L, 274);
    x.letterSpacing = '0px';

    // 한 줄 설명
    x.fillStyle = C.sec; x.font = f(500, 30);
    x.fillText('달력과 할 일을 한 화면에서', L, 322);

    // 색 점 + 짧은 특징 세 줄
    var feats = [
      ['#34C759', '월 · 주 · 일, 세 가지 보기'],
      ['#FF9500', '카테고리마다 다른 색'],
      ['#007AFF', '로그인하면 기기끼리 동기화']
    ];
    x.font = f(500, 21);
    feats.forEach(function (it, i) {
      var y = 386 + i * 38;
      dot(L + 5, y - 6, 5, it[0]);
      x.fillStyle = C.sec; x.fillText(it[1], L + 22, y);
    });

    // 도메인
    x.fillStyle = C.ter; x.font = f(600, 22); x.letterSpacing = '0.5px';
    x.fillText('todo-calendar.kro.kr', L, 540);
    x.letterSpacing = '0px';

    /* ── 오른쪽: 월간 뷰 카드 ─────────────────────────────────── */
    var CXX = 660, CY = 70, CW = 452, CH = 490, P = 28;   // 오른쪽 여백도 88 로 맞다
    x.save();
    x.shadowColor = 'rgba(0,0,0,0.14)'; x.shadowBlur = 44; x.shadowOffsetY = 18;
    x.fillStyle = C.card; rr(CXX, CY, CW, CH, 32); x.fill();
    x.restore();

    // 달 이름 — 연도는 일부러 안 쓴다(그림이 해를 넘겨도 안 낡는다)
    x.fillStyle = C.label; x.font = f(800, 28); x.letterSpacing = '-1px';
    x.fillText('3월', CXX + P, CY + 62);
    x.letterSpacing = '0px';

    // 요일 줄
    var colW = (CW - P * 2) / 7;
    var cx = function (i) { return CXX + P + colW * (i + 0.5); };
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    x.textAlign = 'center'; x.font = f(600, 15);
    days.forEach(function (d, i) {
      x.fillStyle = i === 0 ? 'rgba(255,59,48,0.55)' : C.ter;
      x.fillText(d, cx(i), CY + 104);
    });

    // 날짜 격자 — 일요일에 시작해 31 일로 끝나는 달이라 딱 다섯 줄이다
    var TODAY = 18;
    var events = { 3: 1, 5: 2, 9: 1, 12: 1, 18: 2, 20: 1, 24: 3, 27: 1 };
    x.textBaseline = 'middle';
    for (var d = 1; d <= 31; d++) {
      var col = (d - 1) % 7, row = Math.floor((d - 1) / 7);
      var ax = cx(col), ay = CY + 150 + row * 50;
      if (d === TODAY) { dot(ax, ay, 18, C.tint); }
      x.fillStyle = d === TODAY ? '#FFFFFF' : (col === 0 ? C.red : C.label);
      x.font = f(d === TODAY ? 700 : 500, 17);
      x.fillText(String(d), ax, ay);
      var n = events[d] || 0;
      // 오늘은 지름 36 짜리 동그라미를 깔아서, 점을 그만큼 더 내려야 안 붙는다
      var dy = d === TODAY ? 25 : 20;
      for (var k = 0; k < n; k++) {
        dot(ax + (k - (n - 1) / 2) * 10, ay + dy, 3, CAT[(d + k) % CAT.length]);
      }
    }
    x.textAlign = 'left'; x.textBaseline = 'alphabetic';

    // 구분선
    x.strokeStyle = C.sep; x.lineWidth = 1;
    x.beginPath(); x.moveTo(CXX + P, CY + 386.5); x.lineTo(CXX + CW - P, CY + 386.5); x.stroke();

    // 그 날의 할 일 두 줄 — 달력만 있으면 "할 일" 이 안 보인다
    var todos = [
      [true,  '팀 회의 자료 정리', '오후 2:00'],
      [false, '운동 30분',         '오후 7:30']
    ];
    todos.forEach(function (t, i) {
      var y = CY + 420 + i * 42;   // 마지막 줄과 카드 바닥 사이를 P(28) 로 맞춘다
      if (t[0]) {
        dot(CXX + P + 11, y, 11, C.tint);
        x.strokeStyle = '#FFFFFF'; x.lineWidth = 2.4;
        x.beginPath();
        x.moveTo(CXX + P + 6, y); x.lineTo(CXX + P + 10, y + 4.5); x.lineTo(CXX + P + 17, y - 4.5);
        x.stroke();
      } else {
        x.beginPath(); x.arc(CXX + P + 11, y, 10, 0, 6.284);
        x.strokeStyle = 'rgba(60,60,67,0.28)'; x.lineWidth = 2; x.stroke();
      }
      x.textBaseline = 'middle';
      x.font = f(600, 18); x.fillStyle = t[0] ? C.ter : C.label;
      x.fillText(t[1], CXX + P + 34, y);
      if (t[0]) {                                   // 끝낸 일에는 취소선
        var w = x.measureText(t[1]).width;
        x.strokeStyle = C.ter; x.lineWidth = 1.5;
        x.beginPath(); x.moveTo(CXX + P + 34, y + 0.5); x.lineTo(CXX + P + 34 + w, y + 0.5); x.stroke();
      }
      x.textAlign = 'right'; x.font = f(500, 15); x.fillStyle = C.ter;
      x.fillText(t[2], CXX + CW - P, y);
      x.textAlign = 'left'; x.textBaseline = 'alphabetic';
    });
  }

  // 캔버스는 서체가 안 실려도 **조용히 폴백으로 그리고 성공한다.**
  // 그래서 Pretendard 로 잰 폭과 폴백으로 잰 폭을 비교해서 실제 적용을 확인한다.
  function fontApplied() {
    var s = '할 일 캘린더';
    x.font = f(800, 84); var a = x.measureText(s).width;
    x.font = '800 84px ' + FALLBACK; var b = x.measureText(s).width;
    return Math.abs(a - b) > 1;
  }

  var need = ['800 84px "Pretendard Variable"', '600 18px "Pretendard Variable"',
              '500 30px "Pretendard Variable"'];
  Promise.all(need.map(function (n) { return document.fonts.load(n, '할 일 캘린더 3월 오후'); }))
    .then(function () { return document.fonts.ready; })
    .then(function () {
      var ok = fontApplied();
      draw();
      var url = cv.toDataURL('image/png');
      return fetch('/save', { method: 'POST', body: url })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function (n) {
          window.__og = { saved: true, bytes: +n, fontApplied: ok, w: cv.width, h: cv.height };
          document.getElementById('log').textContent =
            'og.png 저장됨 · ' + n + ' bytes · Pretendard ' + (ok ? '적용됨' : '실패(폴백)');
        })
        .catch(function () {
          window.__og = { saved: false, bytes: 0, fontApplied: ok, w: cv.width, h: cv.height };
          var a = document.createElement('a');
          a.href = url; a.download = 'og.png'; a.textContent = 'og.png 내려받기';
          document.getElementById('log').textContent =
            '서버가 안 받아서 저장 못 함 · Pretendard ' + (ok ? '적용됨' : '실패(폴백)') + ' · ';
          document.getElementById('log').appendChild(a);
        });
    });
})();
</script>
</body>
</html>
